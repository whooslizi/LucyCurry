<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Body -->
  <rect x="5" y="8" width="6" height="8" fill="#212121" />
  <!-- Head -->
  <rect x="5" y="2" width="6" height="6" fill="#f5cbba" />
  <!-- Mask -->
  <rect x="4" y="4" width="8" height="2" fill="#000" />
  <!-- Eyes -->
  <rect x="6" y="4" width="1" height="1" fill="#fff" />
  <rect x="9" y="4" width="1" height="1" fill="#fff" />
  <!-- Bag of money -->
  <rect x="1" y="9" width="5" height="5" fill="#cfd8dc" />
  <rect x="2" y="8" width="3" height="1" fill="#cfd8dc" />
  <!-- Dollar sign on bag -->
  <text x="3.5" y="13" font-family="monospace" font-size="4" fill="#388e3c" text-anchor="middle" font-weight="bold">$</text>
  <!-- Hat (Beanie) -->
  <rect x="5" y="1" width="6" height="2" fill="#424242" />
</svg>